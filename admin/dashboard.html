<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard | Lagos4Rent Admin</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="/assets/css/styles.css"></head><body class="admin-body"><div class="admin-shell">
