<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lagos4Rent Admin</title><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#002A65"><link rel="icon" href="/assets/img/lagos4rent-logo.svg"><link rel="stylesheet" href="/assets/css/styles.css"></head><body>
